# Internal Traefik ingress for in-LAN access (kuro.maiz.local).
# Public access goes through Cloudflare Tunnel — see deployment notes in README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kuro-ingress
  namespace: kuro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: kuro.maiz.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kuro
                port:
                  number: 80
