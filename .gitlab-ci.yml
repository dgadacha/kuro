# GitLab CI/CD for Kuro
#
# Two stages:
#   1. build  — compile the multi-stage Docker image, push to the project's
#               own registry (registry.gitlab.com/kidnar/kuro) tagged with
#               the commit SHA + the branch name (+ kuro-vX.Y.Z when on a
#               matching tag).
#   2. deploy — kubectl rollout the new image into the `kuro` namespace via
#               the GitLab agent for Kubernetes (configured in
#               .gitlab/agents/kuro/config.yaml).
#
# Collaborators can push to main and the deployed pod updates automatically.
# No SSH to the salon node required.

stages:
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE                      # registry.gitlab.com/kidnar/kuro
  KUBE_CONTEXT: kidnar/kuro:kuro                 # <project-path>:<agent-name>

# -----------------------------------------------------------------------------
# Build the docker image (uses Docker-in-Docker on the GitLab shared runners)
# -----------------------------------------------------------------------------
build:image:
  stage: build
  image: docker:27.3
  services:
    - docker:27.3-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE:latest" 2>/dev/null || true     # warm the layer cache
    - docker build
        --cache-from "$IMAGE:latest"
        --tag "$IMAGE:$CI_COMMIT_SHORT_SHA"
        --tag "$IMAGE:$CI_COMMIT_REF_SLUG"
        $( [ "$CI_COMMIT_TAG" ] && echo "--tag $IMAGE:$CI_COMMIT_TAG" )
        $( [ "$CI_COMMIT_REF_NAME" = "main" ] && echo "--tag $IMAGE:latest" )
        .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
    - if [ "$CI_COMMIT_TAG" ];          then docker push "$IMAGE:$CI_COMMIT_TAG";  fi
    - if [ "$CI_COMMIT_REF_NAME" = "main" ]; then docker push "$IMAGE:latest"; fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^kuro-v/'

# -----------------------------------------------------------------------------
# Deploy via the GitLab Kubernetes agent — namespace-scoped, no SSH needed
# -----------------------------------------------------------------------------
deploy:k8s:
  stage: deploy
  image: bitnami/kubectl:1.31
  needs: ["build:image"]
  before_script:
    - kubectl config use-context $KUBE_CONTEXT
    - kubectl version --client=true --output=yaml
  script:
    # Apply manifests (idempotent — same as `kubectl apply -f k8s/` from a laptop).
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/pvc.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl apply -f k8s/deployment.yaml
    # Force the deployment to use this exact build (the Deployment manifest
    # references :latest — we bump to the SHA-tagged image so the rollout
    # actually pulls something new).
    - kubectl -n kuro set image deployment/kuro kuro=$IMAGE:$CI_COMMIT_SHORT_SHA
    - kubectl -n kuro rollout status deployment/kuro --timeout=180s
  environment:
    name: production
    url: https://kuro.nc-maiz.org
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^kuro-v/'
